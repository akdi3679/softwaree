[workspace]
resolver = "2"
members = [
    "modules/sdk",
    "modules/medical-reception",
    "modules/food-lab",
    "modules/retail-pos",
    "modules/gym",
    "modules/school",
    "modules/invoice",
    "modules/hotel",
    "modules/restaurant",
    "modules/auto-billing",
]
exclude = [
    "apps/admin/src-tauri",
    "apps/user/src-tauri",

    "tools/support-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
