[package]
name = "admin"
version = "0.1.0"
description = "Admin desktop app"
authors = ["Product Dev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdns-sd = "0.11"
prometheus = "0.13"
opentelemetry = "0.22"
opentelemetry_sdk = "0.22"
tracing-opentelemetry = "0.23"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
md5 = "0.7"
async-trait = "0.1"
flate2 = "1"
tar = "0.4"
aes-gcm = "0.10"
hmac = "0.12"
wasmtime = "27"
wasmtime-wasi = "27"
tokio-tungstenite = "0.23"
futures-util = "0.3"
printpdf = "0.7"
medical-reception = { path = "../../../modules/medical-reception" }
food-lab = { path = "../../../modules/food-lab" }
product-module-sdk = { path = "../../../modules/sdk" }
totp-rs = { version = "5.7", features = ["otpauth", "gen_secret"] }
csv = "1"
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
uuid = { version = "1.26.0", features = ["v4"] }
argon2 = "0.5"
reqwest = { version = "0.12", features = ["json"] }
fs2 = "0.4.3"
tokio-cron-scheduler = "0.15.1"
ciborium = "0.2"
zstd = "0.13"
zeroize = "1"
zip = "2"
walkdir = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = 'abort'
strip = 'symbols'
debug = false
incremental = false

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "event_append"
harness = false

[[bench]]
name = "sync_rtt"
harness = false
