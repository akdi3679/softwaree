name: admin-build

on:
  push:
    branches: [main]
    paths: ['apps/admin/**', '.github/workflows/admin-build.yml']
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --run

  build:
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: admin-${{ matrix.os }}
          path: |
            apps/admin/src-tauri/target/release/bundle/deb/*.deb
            apps/admin/src-tauri/target/release/bundle/rpm/*.rpm
            apps/admin/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/admin/src-tauri/target/release/bundle/msi/*.msi
            apps/admin/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
