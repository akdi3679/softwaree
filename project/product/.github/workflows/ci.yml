name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, user]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.80.0
          components: rustfmt, clippy
          override: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            apps/${{ matrix.app }}/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.app }}-${{ hashFiles('apps/${{ matrix.app }}/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.app }}-

      - name: Check formatting
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo clippy -- -D warnings
