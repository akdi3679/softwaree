<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Status</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Product Status</h1>
    <p class="muted" id="updated"></p>
  </header>
  <main>
    <section>
      <h2>Overall</h2>
      <div class="big" id="uptime">--</div>
      <p class="muted">Last 30 days</p>
    </section>
    <section>
      <h2>Components</h2>
      <table>
        <thead><tr><th>Component</th><th>Status</th><th>30-day uptime</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <section>
      <h2>Recent incidents</h2>
      <ul id="incidents"><li class="muted">No incidents in the last 30 days.</li></ul>
    </section>
  </main>
  <script>
    async function load() {
      var updatedEl = document.getElementById("updated");
      try {
        var r = await fetch("https://api.example.com/v1/status/public");
        if (!r.ok) throw new Error("status " + r.status);
        var d = await r.json();
        updatedEl.textContent = "Updated " + new Date().toLocaleString();
        document.getElementById("uptime").textContent = (d.uptime_pct_30d || 0).toFixed(2) + "%";
        var rows = document.getElementById("rows");
        rows.innerHTML = "";
        (d.components || []).forEach(function (c) {
          var tr = document.createElement("tr");
          tr.innerHTML = "<td>" + c.name + "</td><td><span class=\"badge badge-" + c.status + "\">" + c.status + "</span></td><td>" + (c.uptime || 0).toFixed(2) + "%</td>";
          rows.appendChild(tr);
        });
      } catch (e) {
        updatedEl.textContent = "Status endpoint unreachable";
      }
    }
    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
