services:
  chaos-postgres-primary:
    image: postgres:16
    container_name: chaos-postgres-primary
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_chaos
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  chaos-postgres-replica:
    image: postgres:16
    container_name: chaos-postgres-replica
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_chaos
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10