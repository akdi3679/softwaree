global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'cloud'
    static_configs:
      - targets: ['cloud-internal:8787']
    metrics_path: /metrics

  - job_name: 'admin'
    dns_sd_configs:
      - names: ['_prometheus._tcp.product.local']
        type: A
        port: 9090

rule_files:
  - alerts.yml
